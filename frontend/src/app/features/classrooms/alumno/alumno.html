<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h2 class="h4 card-title mb-3 fw-bold">Ingresar al Aula</h2>

        @if (errorMsg()) {
          <div class="alert alert-danger py-2 mb-3">{{ errorMsg() }}</div>
        }

        <div class="mb-3">
          <label class="form-label text-muted small">Código de Acceso</label>
          <input type="text" class="form-control" [value]="codigoAcceso()" (input)="codigoAcceso.set(inputCodigo.value)" #inputCodigo placeholder="Ej: GL-1234">
        </div>

        <div class="mb-3">
          <label class="form-label text-muted small">Tu Nombre y Apellido</label>
          <input type="text" class="form-control" [value]="nombre()" (input)="nombre.set(inputNombre.value)" #inputNombre placeholder="Ej: Juan Pérez">
        </div>

        <div class="mb-4">
          <label class="form-label text-muted small">Email (opcional)</label>
          <input type="text" class="form-control" [value]="email()" (input)="email.set(inputEmail.value)" #inputEmail placeholder="alumno@mail.com">
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary px-4" (click)="validar()">Ingresar</button>
          <a class="btn btn-outline-secondary" routerLink="/classrooms">Volver</a>
        </div>
      </div>
    </div>
  </div>
</div>
