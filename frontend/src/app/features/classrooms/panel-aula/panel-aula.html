@if (aula()) {
<div>
    <h1>{{ aula().name }}</h1>
    <p>Profesor: <strong>{{ aula().duenio }}</strong></p>
    <p>Código de acceso: <strong>{{ aula().join_code }}</strong> (compartí este código con tus alumnos)</p>

    @if (usuarioActual()?.rol === 'profesor') {
        <button (click)="eliminarAula()" style="color: red;">Eliminar Aula</button>
    }
    <button (click)="volver()">Volver al inicio</button>
</div>

<hr>

<!-- SECCIÓN GRUPOS (Leandro) -->
<section>
    <h2>Grupos</h2>
    <app-group-list [classroomId]="aula().id" />
</section>

<hr>

<!-- SECCIÓN MIEMBROS (Gonzalo) -->
<section>
    <h2>Miembros</h2>
    <app-member-list [classroomId]="aula().id" />
</section>
} @else {
<p>Cargando datos del aula...</p>
}
