<h2>Crear Nueva Aula (Profesor)</h2>

@if (errorMsg()) {
    <p style="color: red;">{{ errorMsg() }}</p>
}

<div>
    <input type="text" [value]="name()" (input)="name.set(inputName.value)" #inputName placeholder="Nombre del Aula *">
</div>
<div>
    <input type="text" [value]="duenio()" (input)="duenio.set(inputDuenio.value)" #inputDuenio placeholder="Nombre del Profesor *">
</div>
<div>
    <input type="text" [value]="email()" (input)="email.set(inputEmail.value)" #inputEmail placeholder="Email del Profesor (opcional)">
</div>

<div>
    <button (click)="crear()">Crear Aula</button>
    <button (click)="volver.emit()">Volver</button>
</div>
